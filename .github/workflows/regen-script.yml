name: Main savedefconfig script
on:
  workflow_call:
    inputs:
      repo:
        description: 'Kernel repository'
        type: string
        required: true
      branch:
        description: 'Kernel branch'
        type: string
        required: true
      device:
        description: 'Target device'
        type: string
        required: true
      toolchain_url:
        description: 'Custom toolchain URL'
        type: string
        required: false
        default: ''

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      run: git clone --depth=1 --single-branch -b ${{ inputs.branch }} https://github.com/${{ inputs.repo }} kernel_root

    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: ~/clang-22
        key: llvm-22-${{ hashFiles('**/TOOLCHAIN_URL') || 'default' }}

    - name: Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: Fetch Toolchains
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      env:
        TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
      run: bash ./build.sh --fetch-toolchains

    - name: Setup Build Environment
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        echo "buildDetails=$(make kernelversion)-${{ inputs.device }}_$gitsha1" >> $GITHUB_OUTPUT
        echo "currDate=$(date)" >> $GITHUB_OUTPUT

    - name: Regen defconfig for ${{ inputs.device }}
      env:
        DEVICE_TARGET: ${{ inputs.device }}
      run: |
        cd kernel_root
        bash ../build.sh --regen-defconfig

    - name: Upload kernel defconfig
      uses: actions/upload-artifact@v5
      with:
        name: Defconfig-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/out/${{ inputs.device }}_defconfig
